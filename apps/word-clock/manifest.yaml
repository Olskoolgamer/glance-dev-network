gdn: 1
id: word-clock
version: 0.1.0
name: Word Clock
author: glance-led-dev
description: The time spelled out the way you would say it, with a plain digits page behind it.
category: Time
entry: app.star

width: 64
height: 32
refresh: 60

pages: [words, digital]

inputs:
  - key: zip
    type: string
    app_input_type: free-text
    label: Zip code
    default: "10001"
    help: >-
      US zip code. Used to look up your timezone, daylight saving included,
      so there is nothing to adjust twice a year.
  - key: accent
    type: string
    app_input_type: color
    label: Accent color
    default: "#FFB03A"
