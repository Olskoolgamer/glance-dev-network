gdn: 1
id: nfl-gameday
version: 0.1.0
name: NFL Gameday
author: Olskoolgamer
description: Follow any NFL team on your Glance - a live game card with both team logos, score or kickoff time, records, TV network and betting line, recent results with the season record, and the current injury report pulled from ESPN.
category: Sports
entry: app.star

# Panel geometry. Height is 32 (fixed); 192 is the house scroll width.
width: 192
height: 32

# 120s keeps a live score fresh without hammering ESPN; every fetch's
# ttl_seconds is tuned per feed in app.star (scoreboard 120, the rest slower).
refresh: 120

pages: [game, results, injuries]

inputs:
  - key: team
    type: choice
    app_input_type: dropdown
    label: Team
    default: "NEW ORLEANS SAINTS"
    choices:
      - "ARIZONA CARDINALS"
      - "ATLANTA FALCONS"
      - "BALTIMORE RAVENS"
      - "BUFFALO BILLS"
      - "CAROLINA PANTHERS"
      - "CHICAGO BEARS"
      - "CINCINNATI BENGALS"
      - "CLEVELAND BROWNS"
      - "DALLAS COWBOYS"
      - "DENVER BRONCOS"
      - "DETROIT LIONS"
      - "GREEN BAY PACKERS"
      - "HOUSTON TEXANS"
      - "INDIANAPOLIS COLTS"
      - "JACKSONVILLE JAGUARS"
      - "KANSAS CITY CHIEFS"
      - "LAS VEGAS RAIDERS"
      - "LOS ANGELES CHARGERS"
      - "LOS ANGELES RAMS"
      - "MIAMI DOLPHINS"
      - "MINNESOTA VIKINGS"
      - "NEW ENGLAND PATRIOTS"
      - "NEW ORLEANS SAINTS"
      - "NEW YORK GIANTS"
      - "NEW YORK JETS"
      - "PHILADELPHIA EAGLES"
      - "PITTSBURGH STEELERS"
      - "SAN FRANCISCO 49ERS"
      - "SEATTLE SEAHAWKS"
      - "TAMPA BAY BUCCANEERS"
      - "TENNESSEE TITANS"
      - "WASHINGTON COMMANDERS"
    help: The team the panel follows - game card, results, and injury report.

  - key: timezone
    type: choice
    app_input_type: dropdown
    label: Time zone
    default: "America/New_York"
    choices:
      - "America/New_York"
      - "America/Chicago"
      - "America/Denver"
      - "America/Phoenix"
      - "America/Los_Angeles"
      - "America/Anchorage"
      - "Pacific/Honolulu"
      - "America/Sao_Paulo"
      - "America/Mexico_City"
      - "Europe/London"
      - "Europe/Paris"
      - "Europe/Moscow"
      - "Africa/Johannesburg"
      - "Asia/Dubai"
      - "Asia/Kolkata"
      - "Asia/Shanghai"
      - "Asia/Tokyo"
      - "Asia/Singapore"
      - "Australia/Sydney"
      - "Pacific/Auckland"
    help: Kickoff times and game dates are shown in this time zone.

# One 24px and one 16px crest per club, downscaled from ESPN's dark-background
# team logos with hard (0/255) alpha so nothing anti-aliases against the ground.
